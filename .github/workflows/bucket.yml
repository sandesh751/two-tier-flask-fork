name: deploy to gcp bucket

on:
  push:
    branches:  
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: login to gcp
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/511846968460/locations/global/workloadIdentityPools/github-pool/providers/github'
          service_account: 'github-bucket-pusher@project-3d4fd68e-9492-4690-aa8.iam.gserviceaccount.com'

      - name: Upload files to GCS Bucket
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: './' 
          destination: 'github-ka-samaan' 

